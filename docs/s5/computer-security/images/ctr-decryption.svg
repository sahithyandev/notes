<svg xmlns="http://www.w3.org/2000/svg" class="block-image mode" viewBox="0 0 540 185" width="540" height="185" role="img" aria-label="CTR decryption. Independent counter values are encrypted and XORed with ciphertext blocks.">
  <style>.mode text{fill:currentColor;font:500 17px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;dominant-baseline:middle}.mode .cap{fill:currentColor;opacity:.55;font:600 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.09em}.mode .sub{opacity:.65;font-size:15px;font-weight:400}.mode .enc{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-width:1.5}.mode .box{fill:none;stroke:currentColor;stroke-width:1.5}.mode .w{fill:none;stroke:currentColor;stroke-width:1.5}.mode .t-pt{fill:var(--dia-pt,#1f7a4d)}.mode .w-pt{stroke:var(--dia-pt,#1f7a4d)}.mode .t-ct{fill:var(--dia-ct,#b3541e)}.mode .w-ct{stroke:var(--dia-ct,#b3541e)}.mode .t-key{fill:var(--dia-key,#6d4bb6)}.mode .w-key{stroke:var(--dia-key,#6d4bb6)}</style>
  <defs><marker id="ah-ctr-decryption" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 11 6 1.5 10.5 3.5 6z" fill="context-stroke" /></marker></defs>
  <text x="0" y="12" class="cap">DECRYPTION</text>
  <g><text x="175" y="30" text-anchor="middle" class="sub t-key">IV ⊕ ⟨1⟩</text><path class="w w-key" d="M175 38V52" marker-end="url(#ah-ctr-decryption)" /><rect class="enc" x="130" y="52" width="90" height="40" rx="2" /><text x="175" y="72" text-anchor="middle">Eₖ</text><path class="w w-key" d="M175 92V104" marker-end="url(#ah-ctr-decryption)" /><circle class="box" cx="175" cy="116" r="11" /><path class="w" d="M168 116h14M175 109v14" /><text x="95" y="116" text-anchor="middle" class="t-ct">c₁</text><path class="w w-ct" d="M108 116H164" marker-end="url(#ah-ctr-decryption)" /><path class="w w-pt" d="M175 127V152" marker-end="url(#ah-ctr-decryption)" /><text x="175" y="166" text-anchor="middle" class="t-pt">m₁</text></g>
  <g><text x="375" y="30" text-anchor="middle" class="sub t-key">IV ⊕ ⟨2⟩</text><path class="w w-key" d="M375 38V52" marker-end="url(#ah-ctr-decryption)" /><rect class="enc" x="330" y="52" width="90" height="40" rx="2" /><text x="375" y="72" text-anchor="middle">Eₖ</text><path class="w w-key" d="M375 92V104" marker-end="url(#ah-ctr-decryption)" /><circle class="box" cx="375" cy="116" r="11" /><path class="w" d="M368 116h14M375 109v14" /><text x="295" y="116" text-anchor="middle" class="t-ct">c₂</text><path class="w w-ct" d="M308 116H364" marker-end="url(#ah-ctr-decryption)" /><path class="w w-pt" d="M375 127V152" marker-end="url(#ah-ctr-decryption)" /><text x="375" y="166" text-anchor="middle" class="t-pt">m₂</text></g>
