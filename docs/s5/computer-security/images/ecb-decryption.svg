<svg xmlns="http://www.w3.org/2000/svg" class="block-image mode" viewBox="0 0 540 190" width="540" height="190" role="img" aria-label="ECB decryption. Each ciphertext block passes independently through the inverse block cipher to a plaintext block.">
  <style>.mode text{fill:currentColor;font:500 17px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;dominant-baseline:middle}.mode .cap{fill:currentColor;opacity:.55;font:600 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.09em}.mode .enc{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-width:1.5}.mode .w{fill:none;stroke:currentColor;stroke-width:1.5}.mode .t-pt{fill:var(--dia-pt,#1f7a4d)}.mode .w-pt{stroke:var(--dia-pt,#1f7a4d)}.mode .t-ct{fill:var(--dia-ct,#b3541e)}.mode .w-ct{stroke:var(--dia-ct,#b3541e)}</style>
  <defs><marker id="ah-ecb-decryption" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 11 6 1.5 10.5 3.5 6z" fill="context-stroke" /></marker></defs>
  <text x="0" y="12" class="cap">DECRYPTION</text>
  <text x="175" y="40" text-anchor="middle" class="t-ct">c₁</text><path class="w w-ct" d="M175 50V74" marker-end="url(#ah-ecb-decryption)" /><rect class="enc" x="130" y="74" width="90" height="40" rx="2" /><text x="175" y="94" text-anchor="middle">Dₖ</text><path class="w w-pt" d="M175 114V150" marker-end="url(#ah-ecb-decryption)" /><text x="175" y="164" text-anchor="middle" class="t-pt">m₁</text>
  <text x="375" y="40" text-anchor="middle" class="t-ct">c₂</text><path class="w w-ct" d="M375 50V74" marker-end="url(#ah-ecb-decryption)" /><rect class="enc" x="330" y="74" width="90" height="40" rx="2" /><text x="375" y="94" text-anchor="middle">Dₖ</text><path class="w w-pt" d="M375 114V150" marker-end="url(#ah-ecb-decryption)" /><text x="375" y="164" text-anchor="middle" class="t-pt">m₂</text>
</svg>
