<svg xmlns="http://www.w3.org/2000/svg" class="block-image mode" viewBox="0 0 540 405" width="540" height="405" role="img" aria-label="CBC mode. Encryption: each plaintext block is XORed with the previous ciphertext block (the first with the IV) before the cipher. Decryption: each block passes through the inverse cipher then is XORed with the previous ciphertext block (the first with the IV).">
  <style>
    .mode text { fill: currentColor; font: 500 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; dominant-baseline: middle; }
    .mode .cap { fill: currentColor; opacity: 0.55; font: 600 13px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.09em; }
    .mode .sub { opacity: 0.65; font-size: 15px; font-weight: 400; }
    .mode .enc { fill: currentColor; fill-opacity: 0.07; stroke: currentColor; stroke-width: 1.5; }
    .mode .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .mode .div { stroke: currentColor; stroke-opacity: 0.14; stroke-width: 1; }
    .mode .w { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .mode .j { fill: currentColor; }
    .mode .t-pt { fill: var(--dia-pt, #1f7a4d); }
    .mode .w-pt { stroke: var(--dia-pt, #1f7a4d); }
    .mode .t-ct { fill: var(--dia-ct, #b3541e); }
    .mode .w-ct { stroke: var(--dia-ct, #b3541e); }
    .mode .t-key { fill: var(--dia-key, #6d4bb6); }
    .mode .w-key { stroke: var(--dia-key, #6d4bb6); }
  </style>
  <defs>
    <marker id="ah-cbc" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1.5 1.5 11 6 1.5 10.5 3.5 6z" fill="context-stroke" />
    </marker>
  </defs>

  <g>
    <text x="0" y="12" class="cap">ENCRYPTION</text>
    <text x="175" y="30" text-anchor="middle" class="t-pt">m₁</text>
    <path class="w w-pt" d="M175 38 V52" marker-end="url(#ah-cbc)" />
    <circle class="box" cx="175" cy="64" r="11" />
    <path class="w" d="M168 64h14M175 57v14" />
    <text x="76" y="64" text-anchor="middle" class="t-key">IV</text>
    <path class="w w-key" d="M92 64 H164" marker-end="url(#ah-cbc)" />
    <path class="w" d="M175 75 V90" marker-end="url(#ah-cbc)" />
    <rect class="enc" x="130" y="90" width="90" height="40" rx="2" />
    <text x="175" y="110" text-anchor="middle">Eₖ</text>
    <path class="w w-ct" d="M175 130 V170" marker-end="url(#ah-cbc)" />
    <circle class="j" cx="175" cy="146" r="2" />
    <text x="175" y="186" text-anchor="middle" class="t-ct">c₁</text>
    <path class="w w-ct" d="M175 146 H300 V64 H364" marker-end="url(#ah-cbc)" />

    <text x="375" y="30" text-anchor="middle" class="t-pt">m₂</text>
    <path class="w w-pt" d="M375 38 V52" marker-end="url(#ah-cbc)" />
    <circle class="box" cx="375" cy="64" r="11" />
    <path class="w" d="M368 64h14M375 57v14" />
    <path class="w" d="M375 75 V90" marker-end="url(#ah-cbc)" />
    <rect class="enc" x="330" y="90" width="90" height="40" rx="2" />
