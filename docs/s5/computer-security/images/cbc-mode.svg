    <text x="375" y="28" text-anchor="middle" class="t-ct">c₂</text>
    <path class="w w-ct" d="M375 36 V54" marker-end="url(#ah-cbc)" />
    <rect class="enc" x="330" y="54" width="90" height="40" rx="2" />
    <text x="375" y="74" text-anchor="middle">Dₖ</text>
    <path class="w" d="M375 94 V110" marker-end="url(#ah-cbc)" />
    <circle class="box" cx="375" cy="122" r="11" />
    <path class="w" d="M368 122h14M375 115v14" />
    <path class="w w-pt" d="M375 133 V154" marker-end="url(#ah-cbc)" />
    <text x="375" y="168" text-anchor="middle" class="t-pt">m₂</text>
  </g>
</svg>
