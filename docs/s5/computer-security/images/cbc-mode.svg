    <path class="w w-ct" d="M375 130 V170" marker-end="url(#ah-cbc)" />
    <text x="375" y="186" text-anchor="middle" class="t-ct">c₂</text>
  </g>

  <line class="div" x1="0" y1="214" x2="540" y2="214" />

  <g transform="translate(0,224)">
    <text x="0" y="12" class="cap">DECRYPTION</text>
    <text x="175" y="26" text-anchor="middle" class="t-ct">c₁</text>
    <path class="w w-ct" d="M175 34 V54" marker-end="url(#ah-cbc)" />
    <circle class="j" cx="175" cy="40" r="2" />
    <rect class="enc" x="130" y="54" width="90" height="40" rx="2" />
    <text x="175" y="74" text-anchor="middle">Dₖ</text>
