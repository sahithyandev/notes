  <text x="0" y="12" class="cap">ENCRYPTION</text>
  <text x="175" y="30" text-anchor="middle" class="t-pt">m₁</text><path class="w w-pt" d="M175 38V52" marker-end="url(#ah-cbc-encryption)" /><circle class="box" cx="175" cy="64" r="11" /><path class="w" d="M168 64h14M175 57v14" /><text x="76" y="64" text-anchor="middle" class="t-key">IV</text><path class="w w-key" d="M92 64H164" marker-end="url(#ah-cbc-encryption)" /><path class="w" d="M175 75V90" marker-end="url(#ah-cbc-encryption)" /><rect class="enc" x="130" y="90" width="90" height="40" rx="2" /><text x="175" y="110" text-anchor="middle">Eₖ</text><path class="w w-ct" d="M175 130V170" marker-end="url(#ah-cbc-encryption)" /><circle class="j" cx="175" cy="146" r="2" /><text x="175" y="186" text-anchor="middle" class="t-ct">c₁</text><path class="w w-ct" d="M175 146H300V64H364" marker-end="url(#ah-cbc-encryption)" />
  <text x="375" y="30" text-anchor="middle" class="t-pt">m₂</text><path class="w w-pt" d="M375 38V52" marker-end="url(#ah-cbc-encryption)" /><circle class="box" cx="375" cy="64" r="11" /><path class="w" d="M368 64h14M375 57v14" /><path class="w" d="M375 75V90" marker-end="url(#ah-cbc-encryption)" /><rect class="enc" x="330" y="90" width="90" height="40" rx="2" /><text x="375" y="110" text-anchor="middle">Eₖ</text><path class="w w-ct" d="M375 130V170" marker-end="url(#ah-cbc-encryption)" /><text x="375" y="186" text-anchor="middle" class="t-ct">c₂</text>
