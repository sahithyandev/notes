<svg xmlns="http://www.w3.org/2000/svg" class="block-image mode" viewBox="0 0 540 190" width="540" height="190" role="img" aria-label="CBC decryption. Each ciphertext block is decrypted, then XORed with the IV or preceding ciphertext block.">
  <style>.mode text{fill:currentColor;font:500 17px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;dominant-baseline:middle}.mode .cap{fill:currentColor;opacity:.55;font:600 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.09em}.mode .enc{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-width:1.5}.mode .box{fill:none;stroke:currentColor;stroke-width:1.5}.mode .w{fill:none;stroke:currentColor;stroke-width:1.5}.mode .j{fill:currentColor}.mode .t-pt{fill:var(--dia-pt,#1f7a4d)}.mode .w-pt{stroke:var(--dia-pt,#1f7a4d)}.mode .t-ct{fill:var(--dia-ct,#b3541e)}.mode .w-ct{stroke:var(--dia-ct,#b3541e)}.mode .t-key{fill:var(--dia-key,#6d4bb6)}.mode .w-key{stroke:var(--dia-key,#6d4bb6)}</style>
