<svg xmlns="http://www.w3.org/2000/svg"
     class="block-image tcp-chart"
     viewBox="0 0 540 400"
     width="540"
     height="400"
     role="img"
     aria-label="TCP slow start: the congestion window grows exponentially and falls after timed out transmissions.">

  <style>
    .tcp-chart text {
      fill: currentColor;
      font: 500 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .tcp-chart .axis {
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    .tcp-chart .grid {
      stroke: currentColor;
      stroke-opacity: 0.13;
      stroke-width: 1;
    }

    .tcp-chart .curve {
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .tcp-chart .drop {
      stroke: var(--dia-ct, #b3541e);
      stroke-width: 1.8;
      fill: none;
    }

    .tcp-chart .guide {
      stroke: var(--dia-key, #6d4bb6);
      stroke-width: 1.3;
      fill: none;
      stroke-dasharray: 5 5;
    }

    .tcp-chart .muted {
      opacity: 0.68;
    }

    .tcp-chart .accent {
      fill: var(--dia-ct, #b3541e);
    }

    .tcp-chart .purple {
      fill: var(--dia-key, #6d4bb6);
    }
  </style>

  <defs>
    <marker id="tcp-slow-arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="context-stroke" />
    </marker>
  </defs>

  <!-- Grid -->
  <g class="grid">
    <path d="M65 335H510
             M65 285H510
             M65 235H510
             M65 185H510
             M65 135H510
             M65 85H510" />

    <path d="M122 35V335
             M179 35V335
             M236 35V335
             M293 35V335
             M350 35V335
             M407 35V335
             M464 35V335" />
  </g>

  <!-- Axes -->
  <path class="axis"
        d="M65 335V30
           M65 335H516"
        marker-end="url(#tcp-slow-arrow)" />

  <path class="axis"
        d="M59 85H65
           M59 135H65
           M59 185H65
           M59 235H65
           M59 285H65
           M59 335H65" />

  <!-- Labels -->
  <text x="65" y="20" class="muted">Congestion</text>
  <text x="65" y="37" class="muted">window</text>

  <text x="510" y="365"
        text-anchor="end"
        class="muted">
    Transmission number
  </text>

  <text x="54" y="339"
        text-anchor="end"
        class="muted">
    1 MSS
  </text>

  <!-- First slow-start curve -->
  <path class="curve"
        d="M65 335
           C84 333 97 325 108 310
           C121 291 130 260 137 220
           C145 177 157 105 179 77" />

  <!-- First timeout -->
  <path class="drop"
        d="M179 77V335" />

  <!-- Second slow-start curve -->
  <path class="curve"
        d="M179 335
           C198 333 211 325 222 310
           C235 291 244 260 251 220
           C259 177 271 105 293 77" />

  <!-- Second timeout -->
  <path class="drop"
        d="M293 77V335" />

  <!-- Third slow-start curve -->
  <path class="curve"
        d="M293 335
           C312 333 325 325 336 310
           C349 291 358 260 365 220
           C373 177 385 105 407 77" />

  <!-- Third timeout -->
  <path class="drop"
        d="M407 77V335" />

  <!-- Fourth slow-start curve -->
  <path class="curve"
        d="M407 335
           C426 333 439 325 450 310
           C463 291 472 260 479 220" />

  <!-- Timeout threshold guide -->
  <path class="guide"
        d="M179 77H510" />

  <text x="345"
        y="65"
        text-anchor="middle"
        class="purple">
    Timed out transmissions
  </text>

</svg>