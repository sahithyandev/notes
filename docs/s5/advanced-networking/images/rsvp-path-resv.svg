<svg xmlns="http://www.w3.org/2000/svg"
     class="block-image rsvp-seq"
     viewBox="0 0 540 400"
     width="540"
     height="400"
     role="img"
     aria-label="RSVP message flow. PATH messages travel downstream from the sender through the intermediate routers to the receiver. RESV messages travel back upstream and install reservation state along the way.">

  <style>
    .rsvp-seq text {
      fill: currentColor;
      font: 500 14px ui-sans-serif, system-ui, -apple-system,
            "Segoe UI", sans-serif;
    }

    .rsvp-seq .chip {
      fill: none;
      stroke: currentColor;
      stroke-opacity: 0.5;
      stroke-width: 1.4;
    }

    .rsvp-seq .chip-name {
      font-weight: 700;
      text-anchor: middle;
    }

    .rsvp-seq .lifeline {
      stroke: currentColor;
      stroke-opacity: 0.25;
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
    }

    .rsvp-seq .msg {
      fill: none;
      stroke-width: 1.8;
    }

    .rsvp-seq .path-line {
      stroke: var(--dia-key, #6d4bb6);
    }

    .rsvp-seq .resv-line {
      stroke: var(--dia-ct, #b3541e);
    }

    .rsvp-seq .path-label {
      fill: var(--dia-key, #6d4bb6);
    }

    .rsvp-seq .resv-label {
      fill: var(--dia-ct, #b3541e);
    }

    .rsvp-seq .msg-label {
      font-weight: 700;
      font-size: 13px;
      text-anchor: middle;
    }

    .rsvp-seq .muted {
      opacity: 0.68;
      font-size: 13px;
    }
  </style>

  <defs>
    <marker id="rsvp-seq-arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="context-stroke" />
    </marker>
  </defs>

  <!-- Lifelines -->
  <g class="lifeline">
    <line x1="90" y1="90" x2="90" y2="372" />
    <line x1="270" y1="90" x2="270" y2="372" />
    <line x1="450" y1="90" x2="450" y2="372" />
  </g>

  <!-- Participant chips -->
  <g>
    <rect class="chip"
          x="20" y="20"
          width="140" height="62"
          rx="12" />

    <text class="chip-name"
          x="90" y="51">
      Sender
    </text>


    <rect class="chip"
          x="200" y="20"
          width="140" height="62"
          rx="12" />

    <text class="chip-name"
          x="270" y="45">
      Intermediate
    </text>

    <text class="chip-name"
          x="270" y="65">
      Routers
    </text>


    <rect class="chip"
          x="380" y="20"
          width="140" height="62"
          rx="12" />

    <text class="chip-name"
          x="450" y="51">
      Receiver
    </text>
  </g>

  <!-- PATH messages (downstream) -->
  <path class="msg path-line"
        d="M90 148 L262 148"
        marker-end="url(#rsvp-seq-arrow)" />

  <text class="msg-label path-label"
        x="176" y="128">
    PATH (T-spec)
  </text>


  <path class="msg path-line"
        d="M270 198 L442 198"
        marker-end="url(#rsvp-seq-arrow)" />

  <text class="msg-label path-label"
        x="356" y="178">
    PATH (T-spec)
  </text>


  <!-- RESV messages (upstream) -->
  <path class="msg resv-line"
        d="M450 248 L278 248"
        marker-end="url(#rsvp-seq-arrow)" />

  <text class="msg-label resv-label"
        x="364" y="228">
    RESV (R-spec)
  </text>


  <path class="msg resv-line"
        d="M270 298 L98 298"
        marker-end="url(#rsvp-seq-arrow)" />

  <text class="msg-label resv-label"
        x="184" y="278">
    RESV (R-spec)
  </text>


  <!-- Legend -->
  <g class="muted">
    <line class="path-line"
          x1="90" y1="348"
          x2="122" y2="348"
          stroke-width="2.2" />

    <text x="130" y="352">
      PATH downstream
    </text>


    <line class="resv-line"
          x1="90" y1="376"
          x2="122" y2="376"
          stroke-width="2.2" />

    <text x="130" y="380">
      RESV upstream
    </text>
  </g>

</svg>